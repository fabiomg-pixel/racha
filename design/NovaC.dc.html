<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0e6e4a; } a:hover { color: #0a5238; }
    .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #f3f6f4; color: #16201b; font-family: Manrope, system-ui, -apple-system, sans-serif; display: flex; flex-direction: column;">

  <div style="background: #0e6e4a; color: #fff; padding: 16px 22px 26px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 32px; height: 32px; border-radius: 999px; background: rgba(255,255,255,.18); display: grid; place-items: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
      </div>
      <div style="flex: 1; font-size: 15px; font-weight: 700;">Nova despesa</div>
    </div>
    <div style="margin-top: 20px; font-size: 13px; font-weight: 600; opacity: .8;">VALOR</div>
    <div class="num" style="display: flex; align-items: baseline; gap: 5px; margin-top: 2px;">
      <span style="font-size: 26px; font-weight: 600; opacity: .85;">R$</span>
      <span style="font-size: 50px; font-weight: 800; letter-spacing: -1.8px; line-height: 1.08;">247,80</span>
      <span style="width: 3px; height: 40px; background: #fff; margin-left: 3px; border-radius: 2px;"></span>
    </div>
  </div>

  <div style="flex: 1; background: #fff; border-radius: 26px 26px 0 0; margin-top: -16px; padding: 22px 22px 0; display: flex; flex-direction: column; gap: 20px; overflow: hidden;">

    <div>
      <div style="font-size: 14px; font-weight: 700; margin-bottom: 10px;">Quem pagou</div>
      <div style="display: flex; gap: 10px;">
        <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; background: #eaf4ef; border: 2px solid #0e6e4a; color: #0e6e4a; border-radius: 14px; padding: 12px; font-size: 15px; font-weight: 700;">
          <span style="width: 24px; height: 24px; border-radius: 999px; background: #0e6e4a; color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 800;">F</span>
          Eu
        </div>
        <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; background: #f3f6f4; border: 2px solid transparent; color: #6b7a72; border-radius: 14px; padding: 12px; font-size: 15px; font-weight: 600;">
          <span style="width: 24px; height: 24px; border-radius: 999px; background: #dde5e0; color: #6b7a72; display: grid; place-items: center; font-size: 11px; font-weight: 800;">A</span>
          Ana
        </div>
      </div>
    </div>

    <div>
      <div style="font-size: 14px; font-weight: 700; margin-bottom: 10px;">Como dividir</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px;">
        <div style="background: #0e6e4a; color: #fff; border-radius: 14px; padding: 13px; font-size: 14px; font-weight: 700; text-align: center;">Meio a meio</div>
        <div style="background: #f3f6f4; color: #16201b; border-radius: 14px; padding: 13px; font-size: 14px; font-weight: 600; text-align: center;">Por item</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-top: 9px;">
        <div style="background: #f3f6f4; color: #16201b; border-radius: 14px; padding: 11px; font-size: 13px; font-weight: 600; text-align: center;">S&oacute; eu</div>
        <div style="background: #f3f6f4; color: #16201b; border-radius: 14px; padding: 11px; font-size: 13px; font-weight: 600; text-align: center;">S&oacute; Ana</div>
        <div style="background: #f3f6f4; color: #16201b; border-radius: 14px; padding: 11px; font-size: 13px; font-weight: 600; text-align: center;">Valores</div>
      </div>
    </div>

    <div style="background: #eaf4ef; border-radius: 16px; padding: 15px 17px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
        <div class="num" style="font-size: 14px; font-weight: 600; color: #0a5238;">Eu R$&nbsp;123,90</div>
        <div class="num" style="font-size: 14px; font-weight: 600; color: #0a5238;">Ana R$&nbsp;123,90</div>
      </div>
      <div style="height: 1px; background: rgba(14,110,74,.16); margin: 11px 0;"></div>
      <div class="num" style="font-size: 14px; font-weight: 700; color: #0e6e4a;">Ana passa a te dever R$&nbsp;123,90</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; align-items: center; gap: 12px; background: #f3f6f4; border-radius: 14px; padding: 13px 15px;">
        <div style="font-size: 13px; font-weight: 600; color: #6b7a72; width: 74px; flex: none;">Descri&ccedil;&atilde;o</div>
        <div style="flex: 1; font-size: 15px; font-weight: 600;">Mercado da semana</div>
      </div>
      <div style="display: flex; gap: 9px;">
        <div style="flex: 1; display: flex; align-items: center; gap: 9px; background: #f3f6f4; border-radius: 14px; padding: 13px 15px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0e6e4a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/><path d="M2.8 3.5h2.4l2.4 11.8h11"/><path d="M6.6 7.4h14l-1.4 5.9H7.8"/></svg>
          <div style="font-size: 14px; font-weight: 600;">Mercado</div>
        </div>
        <div class="num" style="flex: 1; display: flex; align-items: center; background: #f3f6f4; border-radius: 14px; padding: 13px 15px; font-size: 14px; font-weight: 600;">hoje</div>
      </div>
    </div>
  </div>

  <div style="background: #fff; padding: 10px 22px 18px;">
    <div style="background: #0e6e4a; color: #fff; border-radius: 16px; padding: 15px; font-size: 15px; font-weight: 700; text-align: center; box-shadow: 0 4px 14px rgba(14,110,74,.26);">Salvar despesa</div>
  </div>
</div>
</x-dc>
</body>
</html>
