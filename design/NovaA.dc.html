<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0f7a52; } a:hover { color: #0a5238; }
    .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #f4f6f4; color: #16201b; font-family: Archivo, system-ui, -apple-system, sans-serif; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: #fff; border-bottom: 1px solid #e4e8e4;">
    <div style="display: flex; align-items: center; gap: 6px; color: #0f7a52; font-size: 15px; font-weight: 500;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
      Casal
    </div>
    <div style="flex: 1;"></div>
    <div style="font-size: 13px; color: #6b7a72;">nova despesa</div>
  </div>

  <div style="background: #fff; padding: 22px 18px 20px; border-bottom: 1px solid #e4e8e4;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: .8px; color: #8b998f;">VALOR</div>
    <div class="num" style="display: flex; align-items: baseline; gap: 4px; margin-top: 4px;">
      <span style="font-size: 26px; font-weight: 500; color: #6b7a72;">R$</span>
      <span style="font-size: 46px; font-weight: 700; letter-spacing: -1.4px; line-height: 1.1;">247,80</span>
      <span style="width: 2px; height: 38px; background: #0f7a52; margin-left: 2px;"></span>
    </div>
  </div>

  <div style="padding: 18px 18px 0; display: flex; flex-direction: column; gap: 18px;">

    <div>
      <div style="font-size: 12px; font-weight: 600; letter-spacing: .8px; color: #8b998f; margin-bottom: 8px;">QUEM PAGOU</div>
      <div style="display: flex; gap: 10px;">
        <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; background: #0f7a52; color: #fff; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 600;">
          <span style="width: 22px; height: 22px; border-radius: 999px; background: rgba(255,255,255,.25); display: grid; place-items: center; font-size: 10px; font-weight: 700;">F</span>
          Eu
        </div>
        <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; background: #fff; border: 1px solid #d5ddd7; color: #16201b; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 600;">
          <span style="width: 22px; height: 22px; border-radius: 999px; background: #eef2ef; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #6b7a72;">A</span>
          Ana
        </div>
      </div>
    </div>

    <div>
      <div style="font-size: 12px; font-weight: 600; letter-spacing: .8px; color: #8b998f; margin-bottom: 8px;">COMO DIVIDIR</div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <div style="background: #0f7a52; color: #fff; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; text-align: center;">Meio a meio</div>
          <div style="background: #fff; border: 1px solid #d5ddd7; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 500; text-align: center;">Por item</div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
          <div style="background: #fff; border: 1px solid #d5ddd7; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 500; text-align: center;">S&oacute; eu</div>
          <div style="background: #fff; border: 1px solid #d5ddd7; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 500; text-align: center;">S&oacute; Ana</div>
          <div style="background: #fff; border: 1px solid #d5ddd7; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 500; text-align: center;">Valores</div>
        </div>
      </div>
    </div>

    <div style="background: #e7f6ee; border-radius: 12px; padding: 14px 16px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
        <div class="num" style="font-size: 14px; color: #0a5238;">Eu <b>R$&nbsp;123,90</b></div>
        <div class="num" style="font-size: 14px; color: #0a5238;">Ana <b>R$&nbsp;123,90</b></div>
      </div>
      <div style="height: 1px; background: rgba(15,122,82,.18); margin: 11px 0;"></div>
      <div class="num" style="font-size: 14px; font-weight: 600; color: #0f7a52;">Ana passa a te dever R$&nbsp;123,90</div>
    </div>

    <div style="background: #fff; border: 1px solid #e4e8e4; border-radius: 12px; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-bottom: 1px solid #eef1ee;">
        <div style="font-size: 14px; color: #6b7a72; width: 82px; flex: none;">Descri&ccedil;&atilde;o</div>
        <div style="flex: 1; font-size: 15px; font-weight: 500;">Mercado da semana</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-bottom: 1px solid #eef1ee;">
        <div style="font-size: 14px; color: #6b7a72; width: 82px; flex: none;">Categoria</div>
        <div style="flex: 1; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#4a5a50" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/><path d="M2.8 3.5h2.4l2.4 11.8h11"/><path d="M6.6 7.4h14l-1.4 5.9H7.8"/></svg>
          Mercado
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 13px 14px;">
        <div style="font-size: 14px; color: #6b7a72; width: 82px; flex: none;">Data</div>
        <div class="num" style="flex: 1; font-size: 15px; font-weight: 500;">hoje, 12 de set.</div>
      </div>
    </div>
  </div>

  <div style="flex: 1;"></div>
  <div style="background: #fff; border-top: 1px solid #e4e8e4; padding: 10px 18px 16px;">
    <div style="background: #0f7a52; color: #fff; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 600; text-align: center;">Salvar despesa</div>
  </div>
</div>
</x-dc>
</body>
</html>
